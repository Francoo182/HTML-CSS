<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loguin</title>
    <link rel="stylesheet" href="css/login.css">
    <meta name="description" content="Pagina de login de Monster XD">
</head>
<body>
    <div class="fondo_form">
    <h2 aria-label="Inicio de sesion">Inicio de sesion</h2>
    <form>
        <fieldset>
            <legend aria-label="Informacion de inicio de sesion">Informacion de inicio de sesion</legend>
        <div class="form_input">
            <label for="email" aria-label="Ingrese su email a continuacion">Email</label>
            <input type="email" placeholder="Ingrese su Email" id="email" autocomplete="email">
        </div>
        <div class="form_input">
            <label for="password" aria-label="Ingrese su contraseña a continuacion">Contraseña</label>
            <input type="password" placeholder="Ingrese su Contraseña" id="password">
        </div>
        </fieldset>
        <fieldset>
            <legend aria-label="Area de categoria y invitacion especializada">Categoria y Invitacion especial</legend>
        <div class="form_input">
            <label for="tipo-de-usuario" aria-label="Que tipo de usuario es?">Seleccione su categoria </label>
            <select name="tipo-de-usuario" id="tipo-de-usuario">
                <option value="user1"> Visitante</option>
                <option value="user2"> Agencia</option>
                <option value="user3"> Vendedor</option>
            </select>
        </div>
        <div class="form_input">
            <label for="refID">¿Quien te invito?</label>
            <input list="refID" name="refID" aria-label="Ingrese la persona que lo invito" id="refID">
            <datalist id = "refID" name="type-of-invite">
                <option value="Un Amigo">Puede ser cualquiera</option>
                <option value="Un Videito"> Seguro es algun guru vende humo</option>
                <option value="Mi Vecinito"> tiene antojo?</option>
        </datalist>
        </div>
        </fieldset>
        <div class="form_input">
            <label for="texto">Texto</label>
            <textarea placeholder="Pone pue algo aca" id="texto"></textarea>
        </div>
        <div class="form_input">
            <label for="checkbox">Acepto los <a href="terminos.html" target="_blank">Terminos y condiciones</a> <input type="checkbox" class="checkbox" id="checkbox"></label>
        </div>
    </form>
    </div>
</body>
</html>
