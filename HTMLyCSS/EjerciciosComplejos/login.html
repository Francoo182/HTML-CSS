<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loguin</title>
    <link rel="stylesheet" href="css/login.css">
    <meta name="description" content="Pagina de login de Monster XD">
</head>
<body>
    <div class="fondo_form">
    <h2>Inicio de sesion</h2>
    <form>
        <fieldset>
            <legend>Informacion de inicio de sesion</legend>
        <div class="form_input">
            <label for="nombre">Email</label>
            <input type="email" placeholder="Ingrese su Email" id="nombre">
        </div>
        <div class="form_input">
            <label for="contrasena">Contraseña</label>
            <input type="password" placeholder="Ingrese su Contraseña" id="contrasena">
        </div>
        </fieldset>
        <fieldset>
            <legend>Categoria y Invitacion especial</legend>
        <div class="form_input">
            <label for="tipo-de-usuario">Seleccione su categoria</label>
            <select name="tipo-de-usuario">
                <option> Visitante</option>
                <option> Agencia</option>
                <option> Vendedor</option>
            </select>
        </div>
        <div class="form_input">
            <label>¿Quien te invito?</label>
            <input list="refID" name="refID">
            <datalist id = "refID" name="type-of-invite">
                <option value="Un Amigo">Puede ser cualquiera</option>
                <option value="Un Videito"> Seguro es algun guru vende humo</option>
                <option value="Mi Vecinito"> tiene antojo?</option>
        </datalist>
        </div>
        </fieldset>
        <div class="form_input">
            <label for="texto">Texto</label>
            <textarea placeholder="Pone pue algo aca" id="texto"></textarea>
        </div>
        <div class="form_input">
            <label>Acepto los <a href="terminos.html" target="_blank">Terminos y condiciones</a> <input type="checkbox" class="checkbox"></label>
        </div>
    </form>
    </div>
</body>
</html>
